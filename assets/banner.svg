<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070913"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="pulseCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -20px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-25px, 25px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    @keyframes pillFloat1 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pillFloat2 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }
    .orb-glow1 {
      animation: pulseGlow 6s ease-in-out infinite, floatOrb1 10s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-glow2 {
      animation: pulseGlow 8s ease-in-out infinite, floatOrb2 12s ease-in-out infinite;
      transform-origin: 1000px 250px;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dashMove 4s linear infinite;
    }
    .pill-card-1 {
      animation: pillFloat1 5s ease-in-out infinite;
    }
    .pill-card-2 {
      animation: pillFloat2 6s ease-in-out infinite;
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .sub-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 17px;
      letter-spacing: 0.2px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <path d="M0,60 H1200 M0,120 H1200 M0,180 H1200 M0,240 H1200 M0,300 H1200"/>
    <path d="M120,0 V360 M240,0 V360 M360,0 V360 M480,0 V360 M600,0 V360 M720,0 V360 M840,0 V360 M960,0 V360 M1080,0 V360"/>
  </g>

  <!-- Dynamic Animated Ambient Orbs (Background layer) -->
  <circle class="orb-glow1" cx="200" cy="100" r="140" fill="#6366f1" filter="url(#glow)"/>
  <circle class="orb-glow2" cx="1000" cy="260" r="150" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="600" cy="40" r="120" fill="#a855f7" opacity="0.15" filter="url(#glow)"/>

  <!-- Dynamic Neural/Data Connectors (Flow animation) -->
  <g fill="none" opacity="0.4">
    <path class="flow-line" d="M100,280 C 250,230 350,320 500,270" stroke="#38bdf8" stroke-width="2"/>
    <path class="flow-line" d="M700,270 C 850,220 950,330 1100,270" stroke="#c084fc" stroke-width="2"/>
  </g>

  <!-- Side Floating Pill Cards (Positioned in lateral margins to keep center foreground clear) -->
  <g class="pill-card-1" filter="url(#cardShadow)">
    <rect x="50" y="60" width="165" height="42" rx="21" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="72" cy="81" r="5" fill="#38bdf8"/>
    <text x="88" y="86" class="pill-text">🤖 Autonomous SDR</text>
  </g>

  <g class="pill-card-2" filter="url(#cardShadow)">
    <rect x="980" y="60" width="170" height="42" rx="21" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="1002" cy="81" r="5" fill="#c084fc"/>
    <text x="1018" y="86" class="pill-text">🎯 Cold Outreach AI</text>
  </g>

  <g class="pill-card-2" filter="url(#cardShadow)">
    <rect x="60" y="250" width="175" height="42" rx="21" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="82" cy="271" r="5" fill="#818cf8"/>
    <text x="98" y="276" class="pill-text">⚡ Lead Qualification</text>
  </g>

  <g class="pill-card-1" filter="url(#cardShadow)">
    <rect x="975" y="250" width="175" height="42" rx="21" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="997" cy="271" r="5" fill="#34d399"/>
    <text x="1013" y="276" class="pill-text">🚀 Multi-Channel CRM</text>
  </g>

  <!-- Foreground Title and Content (Centered, clear, prominent) -->
  <g text-anchor="middle">
    <!-- Category Badge -->
    <rect x="490" y="52" width="220" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
    <text x="600" y="72" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="700" font-size="12" fill="#a5b4fc" letter-spacing="1">AWESOME REPOSITORY</text>

    <!-- Main Title with Gradient Fill -->
    <text x="600" y="145" class="main-title" fill="url(#primaryGrad)">Awesome Autonomous AI Sales Outreach</text>

    <!-- Subtitle lines -->
    <text x="600" y="195" class="sub-title">Commercial AI SDR Platforms &amp; Open-Source Sales Outreach Frameworks</text>
    <text x="600" y="225" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" fill="#64748b" font-weight="400">Autonomous Prospecting • Cold Email Personalization • AI BDR Agents • Local-First Sales Automation</text>

    <!-- Stats pills row -->
    <g transform="translate(0, 260)">
      <rect x="410" y="0" width="110" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="465" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Enterprise SaaS</text>

      <rect x="535" y="0" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="600" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#818cf8">Open-Source SDR</text>

      <rect x="680" y="0" width="110" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="735" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">Self-Hostable</text>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>
